<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Ashgate</title>
  <link rel="icon" href="favicon.png">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // The host sets __ashgateMica when the window has a Mica backdrop and a
    // transparent WebView; the page then lets it show through.
    if (window.__ashgateMica) document.documentElement.classList.add("mica");
  </script>
</head>
<body>
  <div class="app">
    <header class="topbar" id="topbar"></header>
    <main class="board" id="board" aria-label="Полосы маршрутов"></main>
    <footer class="dock" id="dock"></footer>
  </div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <noscript>Для окна Ashgate нужен JavaScript (Microsoft Edge WebView2).</noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
